# Builds the macOS app on a GitHub runner and attaches it, zipped, to a new
# GitHub Release marked latest, so
# https://github.com/mepkn/khali/releases/latest/download/khali-macos.zip
# always serves the newest build (the link on dash). Started by hand: Actions
# tab → macOS app → Run workflow, or `gh workflow run macos-app.yml`.
#
# The app is unsigned: on first launch, right-click it → Open (or run
# `xattr -dr com.apple.quarantine khali.app`).
name: macOS app

on:
  workflow_dispatch:

permissions:
  # write: to create the release.
  contents: write

concurrency:
  group: macos-app
  cancel-in-progress: false

jobs:
  build:
    # Apple silicon runner; the universal build adds an Intel binary.
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        # Same version as go.mod.
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.30

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build app
        id: build
        run: |
          wails3 task darwin:package:universal
          short=$(git rev-parse --short HEAD)
          mkdir -p dist
          ditto -c -k --keepParent "bin/khali.app" "dist/khali-macos.zip"
          echo "short=$short" >> "$GITHUB_OUTPUT"

      - name: Publish release
        # Tag desktop-<run number>, one release per build. The asset keeps a
        # fixed name so the releases/latest/download link never changes.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "desktop-${{ github.run_number }}" "dist/khali-macos.zip" \
            --target "$GITHUB_SHA" --latest \
            --title "macOS app ${{ github.run_number }} (${{ steps.build.outputs.short }})" \
            --notes "Unsigned macOS build (Apple silicon and Intel) from ${{ steps.build.outputs.short }} by run ${{ github.run_id }}. First launch: right-click the app → Open."
